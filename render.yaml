# Render blueprint: GPU Broker backend web service.
# See BUILD_SPEC.md for full setup context.
#
# ARCHITECTURE NOTE: metering runs IN-APP (see backend/main.py's
# _meter_loop/_keepalive_loop), not as a separate Render Cron Job --
# this account is on the free tier with no card on file, and Render
# cron requires a payment method. The web service self-pings its own
# PUBLIC url every 4 minutes to avoid the free-tier 15-minute
# spin-down, and runs a metering pass every 5 minutes in the same
# process. There is deliberately no separate cron service below.
#
# Deploy: connect this repo to Render, then apply this blueprint, or
# create the service manually with these settings.

services:
  - type: web
    name: gpu-broker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PUBLIC_URL
        value: https://gpu-broker-api.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENV
        value: sandbox
      - key: PADDLE_PRICE_ID_5
        sync: false
      - key: PADDLE_PRICE_ID_10
        sync: false
      - key: PADDLE_PRICE_ID_20
        sync: false
      - key: PADDLE_PRICE_ID_50
        sync: false
      - key: PADDLE_PRICE_ID_100
        sync: false
      - key: VAST_API_KEY
        sync: false
      - key: RUNPOD_API_KEY
        sync: false
      - key: BROKER_SSH_PUBLIC_KEY
        sync: false
      - key: BROKER_SSH_PRIVATE_KEY_PATH
        value: /etc/secrets/broker_key
    disk:
      name: broker-secrets
      mountPath: /etc/secrets
      sizeGB: 1
