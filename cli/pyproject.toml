[project]
name = "cloudweaver"
version = "0.1.0"
description = "Rent the cheapest verified-available GPU from your terminal -- Cloud Weaver weaves together multiple GPU marketplaces, verifies every machine before you're billed for it"
requires-python = ">=3.9"
dependencies = [
    "click==8.1.7",
    "requests==2.32.3",
]

[project.scripts]
cloudweaver = "cloudweaver_cli.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
